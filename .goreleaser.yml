version: 2

builds:
  - main: ./cmd/orb
    binary: orb
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - formats:
      - tar.gz

dockers_v2:
  - images:
      - "ghcr.io/joelanford/orb"
    tags:
      - "{{ .Env.IMAGE_TAG }}"
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile

changelog:
  use: github-native
  disable: '{{ ne .Env.ENABLE_RELEASE_PIPELINE "true" }}'

release:
  disable: '{{ ne .Env.ENABLE_RELEASE_PIPELINE "true" }}'
