version: "2"

linters:
  enable:
    - errorlint
    - gocritic
    - misspell
    - unconvert
    - revive

  settings:
    errcheck:
      check-type-assertions: false
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - os.RemoveAll
    errorlint:
      asserts: true
    gocritic:
      enabled-tags:
        - diagnostic
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

  exclusions:
    rules:
      - path: internal/image/
        linters: [revive]
        text: "var-naming: avoid package names"
      - linters: [errcheck]
        text: "Error return value of `.*\\.Close` is not checked"
